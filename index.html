<h1>Imobiliária</h1>

<form action="/buscar">
    Buscar endereço:
    <input type="text" name="q">
    <button type="submit">Buscar</button>
</form>

<form action="/filtro">
    Preço até:
    <input type="text" name="preco">
    <button type="submit">Filtrar</button>
</form>

<a href="/login">Área Administrativa</a>

<table border="1">
<tr>
    <th>Tipo</th>
    <th>Endereço</th>
    <th>Preço</th>
    <th>Quartos</th>
    <th>Foto</th>
    <th>Status</th>
</tr>

{% for im in imoveis %}
<tr>
    <td>{{ im[1] }}</td>
    <td>{{ im[2] }}</td>
    <td>{{ im[3] }}</td>
    <td>{{ im[4] }}</td>
    <td><img src="/{{ im[5] }}" width="120"></td>
    <td>{{ im[6] }}</td>
</tr>
{% endfor %}
</table>
